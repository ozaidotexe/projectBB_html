<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUG BOX Terminal - Market Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col items-center justify-center">

    <div class="w-full max-w-md bg-gray-800 border border-gray-700 rounded-2xl p-6 shadow-xl">
        <div class="flex justify-between items-center border-b border-gray-700 pb-3 mb-4">
            <h3 class="text-lg font-bold text-amber-400 flex items-center gap-2">
                <i class="fa-solid fa-clock"></i> Jadwal Sesi Pasar
            </h3>
            <span id="server-time" class="text-xs text-gray-400 font-mono">--:--:-- WIB</span>
        </div>

        <!-- Container Jadwal Dinamis -->
        <div id="market-schedule-list" class="space-y-3">
            <div class="text-center text-gray-500 py-6 text-sm animate-pulse">
                ⏳ Memuat jadwal dari database...
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "http://localhost:5001";

        async function updateMarketStatus() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/market/schedule`);
                
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const result = await response.json();

                if (result.status === "success") {
                    const container = document.getElementById('market-schedule-list');

                    if (!result.data || result.data.length === 0) {
                        container.innerHTML = `<div class="text-center text-gray-400 py-4 text-sm">Tidak ada jadwal pasar tersedia.</div>`;
                        return;
                    }

                    const cardsHtml = result.data.map(item => {
						// 1. Ambil nilai dengan fallback aman agar tidak memunculkan 'undefined'
						const name = item.name || item.item_name || item.item_key || 'Item Pasar';
						const itemKey = item.item_key || '-';
						const startTime = item.start_time || item.open_time || '00:00';
						const endTime = item.end_time || item.close_time || '00:00';
						const holdDays = item.hold_days !== undefined ? item.hold_days : 0;
						const profitPercent = item.profit_percent !== undefined ? item.profit_percent : 0;
						
						// Format angka poin agar aman
						const pointNow = item.point_now !== undefined ? Number(item.point_now).toLocaleString('id-ID') : '0';

						// 2. Tentukan badge status pasar
						const isOpen = item.status === "OPEN" || item.is_open === true;
						const statusBadge = isOpen
							? `<span class="text-xs font-semibold text-green-400 bg-green-500/10 px-2.5 py-1 rounded border border-green-500/20 animate-pulse">🟢 BUKA</span>`
							: `<span class="text-xs font-semibold text-red-400 bg-red-500/10 px-2.5 py-1 rounded border border-red-500/20">🔴 TUTUP</span>`;

						// 3. Render HTML
						return `
							<div class="flex justify-between items-center p-3 bg-gray-900/60 rounded-xl border border-gray-700/80 hover:border-amber-500/50 transition">
								<div class="space-y-1">
									<div class="flex items-center gap-2">
										<span class="font-bold text-white text-sm">📦 ${name}</span>
										<span class="text-[10px] text-gray-400 font-mono">(${itemKey})</span>
									</div>
									<p class="text-xs text-gray-400">
										⏰ Jam: <span class="text-gray-200 font-semibold">${startTime} - ${endTime}</span> | Hold: <span class="text-gray-200 font-semibold">${holdDays} d</span>
									</p>
								</div>
								<div class="text-right flex flex-col items-end gap-1.5">
									${statusBadge}
									<div class="flex items-center gap-2 text-xs">
										<span class="text-green-400 font-bold">+${profitPercent}%</span>
										<span class="text-amber-400 font-medium font-mono">${pointNow} pts</span>
									</div>
								</div>
							</div>
						`;
					}).join('');

                    container.innerHTML = cardsHtml;
                }
            } catch (err) {
                console.error("Gagal memperbarui jadwal:", err);
                const container = document.getElementById('market-schedule-list');
                container.innerHTML = `
                    <div class="text-center text-red-400 py-4 text-sm bg-red-500/10 rounded-xl border border-red-500/20">
                        ❌ Gagal terhubung ke server API.
                    </div>
                `;
            }
        }

        // Tampilkan jam server berjalan (WIB)
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta' });
            document.getElementById('server-time').innerText = timeString + " WIB";
        }

        // Jalankan saat halaman pertama load
        updateMarketStatus();
        updateClock();

        // Refresh data otomatis
        setInterval(updateMarketStatus, 10000);
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
